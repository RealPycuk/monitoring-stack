name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  configs:
    name: Configs & alert unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare example configs
        run: |
          cp prometheus/targets/tcp.example.yml prometheus/targets/tcp.yml
          cp prometheus/targets/https.example.yml prometheus/targets/https.yml
          cp .env.example .env

      - name: promtool check config
        run: docker run --rm -v "$PWD/prometheus":/p:ro --entrypoint promtool prom/prometheus:v3.2.1 check config /p/prometheus.yml

      - name: promtool test rules
        run: docker run --rm -v "$PWD/prometheus":/p:ro -w /p --entrypoint promtool prom/prometheus:v3.2.1 test rules alerts_test.yml

      - name: amtool check-config
        run: docker run --rm -v "$PWD/alertmanager":/a:ro --entrypoint amtool prom/alertmanager:v0.28.1 check-config /a/alertmanager.example.yml

      - name: blackbox config check
        run: docker run --rm -v "$PWD/blackbox":/b:ro prom/blackbox-exporter:v0.26.0 --config.file=/b/blackbox.yml --config.check

      - name: Grafana dashboards are valid JSON
        run: for f in grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null && echo "OK $f"; done

      - name: docker compose config
        run: docker compose config -q

  smoke:
    name: Smoke test (whole stack)
    runs-on: ubuntu-latest
    needs: configs
    steps:
      - uses: actions/checkout@v4

      - name: Prepare configs and dummy secrets
        run: |
          cp .env.example .env
          cp alertmanager/alertmanager.example.yml alertmanager/alertmanager.yml
          echo "123456:dummy" > alertmanager/bot_token
          # цель blackbox — порт самого Prometheus на раннере
          printf -- '- targets: ["127.0.0.1:9090"]\n  labels: {server: ci}\n' > prometheus/targets/tcp.yml
          echo '[]' > prometheus/targets/https.yml

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 120

      - name: Services are ready
        run: |
          wait_url() { for _ in $(seq 1 30); do curl -fsS "$1" && return 0; sleep 2; done; return 1; }
          wait_url http://127.0.0.1:9090/-/ready
          wait_url http://127.0.0.1:9093/-/ready
          wait_url http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:9100/metrics | grep -q node_cpu_seconds_total
          curl -fsS "http://127.0.0.1:9115/probe?module=tcp_connect&target=127.0.0.1:9090" | grep -q 'probe_success 1'

      - name: Prometheus scrapes targets and loaded all rules
        run: |
          for _ in $(seq 1 30); do
            up=$(curl -fsS -G http://127.0.0.1:9090/api/v1/query \
              --data-urlencode 'query=sum(up{job=~"prometheus|node|alertmanager|blackbox"})' | jq -r '.data.result[0].value[1] // 0')
            [ "$up" = "4" ] && break
            sleep 5
          done
          echo "targets up: $up"; [ "$up" = "4" ]
          rules=$(curl -fsS http://127.0.0.1:9090/api/v1/rules | jq '[.data.groups[].rules[]] | length')
          echo "rules loaded: $rules"; [ "$rules" -eq 10 ]

      - name: Grafana provisioned datasource and dashboard
        run: |
          set -a; . ./.env; set +a
          auth="$GF_SECURITY_ADMIN_USER:$GF_SECURITY_ADMIN_PASSWORD"
          curl -fsS -u "$auth" http://127.0.0.1:3000/api/datasources/uid/prometheus | jq -e '.type == "prometheus"'
          curl -fsS -u "$auth" "http://127.0.0.1:3000/api/search?type=dash-db" | jq -e 'length >= 1'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 50

      - name: Stop stack
        if: always()
        run: docker compose down -v
